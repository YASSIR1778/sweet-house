<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" type="image/svg+xml" href="/sweet-house/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>لوحة التحكم — Sweet House</title>
    <script>
      try {
        var t = localStorage.getItem('sh-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches && 'admin' !== 'site')) document.documentElement.classList.add('dark');
        var l = localStorage.getItem('sh-lang');
        if (l === 'fr') { document.documentElement.lang = 'fr'; document.documentElement.dir = 'ltr'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/apps/admin/main.tsx"></script>
  </body>
</html>
